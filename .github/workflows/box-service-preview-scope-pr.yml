name: Box service-preview token scope
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preview-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact production guest proxy scope with synthetic services
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/previewscope && mkdir -p /tmp/previewscope/work
          O=box-service-preview-scope.txt; : >"$O"
          tag=agent-server-v0.0.49-ascii-prod29
          curl -fL "https://github.com/ariana-dot-dev/agent-server/releases/download/$tag/ascii-agents-server-linux-x64" -o /tmp/previewscope/agent
          chmod +x /tmp/previewscope/agent

          cat >/tmp/previewscope/services.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import threading
          from pathlib import Path
          class H(BaseHTTPRequestHandler):
              label='unknown'
              def _go(self):
                  n=int(self.headers.get('content-length','0') or 0)
                  body=self.rfile.read(n) if n else b''
                  msg=(self.label+'|method='+self.command+'|path='+self.path+'|body='+body.decode('utf-8','replace')).encode()
                  with Path('/tmp/previewscope/service.log').open('a') as f: f.write(msg.decode()+'\n')
                  self.send_response(200); self.send_header('content-type','text/plain'); self.send_header('content-length',str(len(msg))); self.end_headers(); self.wfile.write(msg)
              do_GET=_go; do_POST=_go; do_PUT=_go; do_DELETE=_go; do_PATCH=_go
              def log_message(self,*a): pass
          def serve(addr,port,label):
              C=type(label,(H,),{'label':label}); HTTPServer((addr,port),C).serve_forever()
          threading.Thread(target=serve,args=('0.0.0.0',18081,'INTENDED_PUBLIC_BIND'),daemon=True).start()
          threading.Thread(target=serve,args=('127.0.0.1',18082,'LOOPBACK_ONLY_CANARY'),daemon=True).start()
          threading.Event().wait()
          PY
          python3 /tmp/previewscope/services.py >/tmp/previewscope/services.log 2>&1 & spid=$!

          export MACHINE_ID=box-node-previewscope
          export SHARED_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          export WORK_DIR=/tmp/previewscope/work HOME=/tmp/previewscope/work ASCII_PORT=18916 IS_SANDBOX=1
          export BACKEND_URL=http://127.0.0.1:9 BOX_CLI_API_URL=http://127.0.0.1:9
          export SERVICE_PREVIEW_TOKEN='SYNTHETIC_PRIVATE_PREVIEW_TOKEN'
          /tmp/previewscope/agent >/tmp/previewscope/agent.log 2>&1 & apid=$!
          cleanup(){ kill "$apid" "$spid" 2>/dev/null || true; wait "$apid" "$spid" 2>/dev/null || true; }; trap cleanup EXIT
          for i in $(seq 1 100); do curl -sS --max-time 1 http://127.0.0.1:18916/health >/dev/null 2>&1 && break; sleep .2; done

          echo "TAG=$tag" >>"$O"
          echo "SHA256=$(sha256sum /tmp/previewscope/agent|awk '{print $1}')" >>"$O"
          req(){ n=$1; m=$2; u=$3; d=${4-}; : >/tmp/previewscope/body; a=(-sS --path-as-is --max-time 5 -o /tmp/previewscope/body -w '%{http_code}' -X "$m" "$u"); [ -n "$d" ] && a+=(-H 'Content-Type: text/plain' --data-binary "$d"); c=$(curl "${a[@]}" 2>/dev/null||true); printf '%-32s status=%s body=%s\n' "$n" "$c" "$(tr '\n\r' '  ' </tmp/previewscope/body|head -c 500)" >>"$O"; }

          base=http://127.0.0.1:18916/service-preview/SYNTHETIC_PRIVATE_PREVIEW_TOKEN
          req intended GET "$base/18081/hello?x=1"
          req loopback-only GET "$base/18082/secret-canary?x=2"
          req loopback-write POST "$base/18082/admin/action" 'SYNTHETIC_MUTATION_CANARY'
          req wrong-token GET 'http://127.0.0.1:18916/service-preview/WRONG/18082/secret-canary'
          req own-agent-health GET "$base/18916/health"
          echo '=== service log ===' >>"$O"; cat /tmp/previewscope/service.log >>"$O" || true
          if grep -q 'loopback-only.*status=200.*LOOPBACK_ONLY_CANARY' "$O" && grep -q 'loopback-write.*status=200.*SYNTHETIC_MUTATION_CANARY' "$O" && grep -q 'wrong-token.*status=403' "$O"; then
             echo 'ARBITRARY_LOOPBACK_HTTP_PORT_WITH_ONE_PREVIEW_TOKEN=CONFIRMED' >>"$O"
          else
             echo 'ARBITRARY_LOOPBACK_HTTP_PORT_WITH_ONE_PREVIEW_TOKEN=NOT_CONFIRMED' >>"$O"
          fi
          cat "$O"

      - name: Extract current prod CLI hosting/token semantics
        shell: bash
        run: |
          set -euo pipefail
          O=box-service-preview-cli-semantics.txt; : >"$O"
          curl -fL 'https://ascii.dev/api/box/cli/download?platform=linux-x64&channel=ascii-prod' -o /tmp/boxcli
          chmod +x /tmp/boxcli
          /tmp/boxcli --version >>"$O" 2>&1 || true
          strings -a -n 4 /tmp/boxcli | grep -Eai -C 8 'hosted ports are private|access token|host list|host hide|protectedAccess|publicAccess|isProtected|SERVICE_PREVIEW_TOKEN|service-preview|on\.ascii\.dev|host <port>|Expose.*port|private.*default|protected.*url|access.*url' | head -n 12000 >>"$O" || true
          cat "$O"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: box-service-preview-scope
          path: |
            box-service-preview-scope.txt
            box-service-preview-cli-semantics.txt
          if-no-files-found: error
