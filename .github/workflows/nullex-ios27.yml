name: Nullex iOS 27 Sideload

on:
  push:
    branches:
      - nullex-wblock-ios27
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nullex-ios27-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Checkout Nullex overlay
        uses: actions/checkout@v4

      - name: Checkout wBlock upstream
        uses: actions/checkout@v4
        with:
          repository: 0xCUB3/wBlock
          ref: a57ee911dcaf063e4209e26dd256203dffa072b7
          path: wblock

      - name: Verify macOS 27 / Xcode 27
        run: |
          sw_vers
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "27.0"

      - name: Verify exact Nullex icon
        run: |
          set -euo pipefail
          echo "22183d80aab6536b184c0fde7ae7344b9d2fe0a3423797edc1ff36b3d772c8b4  .nullex/NullexIcon.jpeg" | shasum -a 256 -c -

      - name: Apply Nullex derivative overlay
        run: |
          set -euo pipefail
          python3 .nullex/apply_nullex.py wblock
          grep -q 'com.nightvibes33.nullex' wblock/wBlock.xcodeproj/project.pbxproj
          grep -q 'RuntimeBundleIdentity' wblock/wBlockCoreService/GroupIdentifier.swift
          grep -q 'Nullex' wblock/NULLEX_NOTICE.md
          grep -q 'a57ee911dcaf063e4209e26dd256203dffa072b7' wblock/NULLEX_NOTICE.md
          grep -q 'AdGuard Experimental Filter' wblock/wBlock/FilterListLoader.swift
          grep -q 'category: FilterListCategory.experimental' wblock/wBlock/FilterListLoader.swift
          grep -q 'rules_foreign_experimental_ios.json' wblock/wBlockCoreService/ContentBlockerTargets.swift
          grep -q 'Nullex 4' wblock/wBlockCoreService/ContentBlockerTargets.swift

      - name: Audit Nullex branding and upstream UI parity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          root=Path("wblock")
          problems=[]

          # Localized/UI resources must not leak the old product name.
          for p in root.rglob("Localizable.strings"):
              txt=p.read_text(errors="ignore")
              if "wBlock" in txt:
                  problems.append(str(p))
          for p in (root/"wBlock Scripts (iOS)"/"Resources"/"_locales").rglob("messages.json"):
              txt=p.read_text(errors="ignore")
              if "wBlock" in txt:
                  problems.append(str(p))

          # Bundle display names must be Nullex-branded.
          for p in [
              root/"wBlock"/"Info.plist",
              root/"wBlock Ads (iOS)"/"Info.plist",
              root/"wBlock Privacy (iOS)"/"Info.plist",
              root/"wBlock Security (iOS)"/"Info.plist",
              root/"wBlock Foreign (iOS)"/"Info.plist",
              root/"wBlock Custom (iOS)"/"Info.plist",
              root/"wBlock Scripts (iOS)"/"Info.plist",
          ]:
              if p.exists() and "wBlock" in p.read_text(errors="ignore"):
                  problems.append(str(p))

          # No custom Nullex-only screen should have been injected; retain
          # upstream wBlock layout/feature visibility.
          cv=(root/"wBlock"/"ContentView.swift").read_text()
          if "nullexHeroView" in cv:
              problems.append("custom Nullex hero leaked into upstream UI")

          # The derivative must not add Files exposure or other Nullex-only
          # capabilities that upstream wBlock does not expose.
          import plistlib
          main_info=root/"wBlock"/"Info.plist"
          with main_info.open("rb") as fh:
              plist=plistlib.load(fh)
          for key in ["UIFileSharingEnabled", "LSSupportsOpeningDocumentsInPlace"]:
              if key in plist:
                  problems.append(f"Nullex-only exposed capability: {key}")

          # Experimental stays an upstream filter category; it is not a sixth
          # content-blocker extension.
          loader=(root/"wBlock"/"FilterListLoader.swift").read_text(errors="ignore")
          if "AdGuard Experimental Filter" not in loader or "FilterListCategory.experimental" not in loader:
              problems.append("upstream Experimental filter catalog entry missing")

          # User-facing Swift surfaces must not expose the old product name.
          ui_swift = [
              "ContentView.swift", "SettingsView.swift", "OnboardingView.swift",
              "ApplyChangesProgressView.swift", "UserScriptManagerView.swift",
              "LogsView.swift", "BackupManager.swift", "SponsorBlockTransferView.swift",
              "AppTabView.swift", "FilterFallbacksView.swift", "FilterUpdateShortcuts.swift",
              "FilterCategorySupport.swift", "FilterInfoView.swift", "SiteSettingsView.swift",
          ]
          for name in ui_swift:
              p=root/"wBlock"/name
              if not p.exists():
                  continue
              for line_no,line in enumerate(p.read_text(errors="ignore").splitlines(),1):
                  # Ignore comments, imports, internal symbols, URLs and NSError domains.
                  stripped=line.strip()
                  if stripped.startswith("//") or "import wBlockCoreService" in line:
                      continue
                  if "github.com/0xCUB3/wBlock" in line or 'NSError(domain: "wBlock.' in line:
                      continue
                  if '"' in line and "wBlock" in line:
                      problems.append(f"{p}:{line_no}: old brand in visible string")

          popup=root/"wBlock Scripts (iOS)"/"Resources"/"pages"/"popup"/"popup.js"
          if popup.exists():
              pt=popup.read_text(errors="ignore")
              for visible in ["Open wBlock", "Open wBlock to finish", "Open wBlock to resume"]:
                  if visible in pt:
                      problems.append(f"{popup}: {visible}")
          zapper=root/"wBlock Scripts (iOS)"/"Resources"/"zapper-content.js"
          if zapper.exists() and "wBlock Element Zapper" in zapper.read_text(errors="ignore"):
              problems.append(f"{zapper}: old accessible product label")

          if problems:
              print("Branding/UI parity audit failed:")
              for p in problems: print(" -",p)
              sys.exit(1)
          print("Nullex branding resources clean; upstream UI hierarchy preserved.")
          PY

      - name: Install exact icon across app and Safari extension
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/.nullex/NullexIcon.jpeg"
          ICON_DIR="$RUNNER_TEMP/nullex-icons"
          mkdir -p "$ICON_DIR"

          sips -s format png -z 1024 1024 "$SRC" --out "$ICON_DIR/1024.png" >/dev/null

          APP_ICONS="$GITHUB_WORKSPACE/wblock/wBlock/Resources/Assets.xcassets/AppIcon.appiconset"
          SCRIPT_ICONS="$GITHUB_WORKSPACE/wblock/wBlock Scripts (iOS)/Resources/Assets.xcassets/AppIcon.appiconset"
          for dst in "$APP_ICONS" "$SCRIPT_ICONS"; do
            cp "$ICON_DIR/1024.png" "$dst/1.png"
            cp "$ICON_DIR/1024.png" "$dst/2.png"
            cp "$ICON_DIR/1024.png" "$dst/3.png"
          done

          WEB_ICONS="$GITHUB_WORKSPACE/wblock/wBlock Scripts (iOS)/Resources/assets/images"
          mkdir -p "$WEB_ICONS"
          for size in 48 96 128 256 512; do
            sips -s format png -z "$size" "$size" "$SRC" --out "$WEB_ICONS/icon-$size.png" >/dev/null
          done

      - name: Restore Xcode and SwiftPM cache
        uses: actions/cache@v4
        with:
          path: |
            wblock/DerivedData/SourcePackages
            wblock/DerivedData/ModuleCache.noindex
            wblock/DerivedData/SDKStatCaches.noindex
            wblock/DerivedData/Build/Intermediates.noindex
            wblock/DerivedData/Build/Products
            ~/Library/Caches/org.swift.swiftpm
          key: nullex-xcode27-${{ runner.arch }}-a57ee911-${{ hashFiles('.nullex/apply_nullex.py') }}
          restore-keys: |
            nullex-xcode27-${{ runner.arch }}-a57ee911-
            nullex-xcode27-${{ runner.arch }}-
      - name: Build Nullex unsigned for iOS 27
        working-directory: wblock
        run: |
          set -o pipefail
          xcodebuild \
            -project wBlock.xcodeproj \
            -scheme wBlock \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=27.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=113 \
            build | tee xcodebuild.log

      - name: Force exact uploaded icon into final app bundle
        working-directory: wblock
        run: |
          set -euo pipefail
          APP="$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"

          SRC="$GITHUB_WORKSPACE/.nullex/NullexIcon.jpeg"
          OUT="$RUNNER_TEMP/nullex-final-icons"
          mkdir -p "$OUT"

          # iPhone 16 uses the 3x phone icon. Build every legacy icon directly
          # from the exact user-supplied master, then point Info.plist at these
          # raw files so Assets.car cannot substitute the upstream artwork.
          sips -s format png -z 120 120 "$SRC" --out "$OUT/NullexIcon60@2x.png" >/dev/null
          sips -s format png -z 180 180 "$SRC" --out "$OUT/NullexIcon60@3x.png" >/dev/null
          sips -s format png -z 152 152 "$SRC" --out "$OUT/NullexIcon76@2x~ipad.png" >/dev/null
          sips -s format png -z 167 167 "$SRC" --out "$OUT/NullexIcon83.5@2x~ipad.png" >/dev/null

          cp "$OUT/NullexIcon60@2x.png" "$APP/NullexIcon60@2x.png"
          cp "$OUT/NullexIcon60@3x.png" "$APP/NullexIcon60@3x.png"
          cp "$OUT/NullexIcon76@2x~ipad.png" "$APP/NullexIcon76@2x~ipad.png"
          cp "$OUT/NullexIcon83.5@2x~ipad.png" "$APP/NullexIcon83.5@2x~ipad.png"

          python3 - "$APP/Info.plist" <<'PY'
          import plistlib, sys
          p=sys.argv[1]
          with open(p,'rb') as f:
              d=plistlib.load(f)
          d['CFBundleName']='Nullex'
          d['CFBundleDisplayName']='Nullex'
          d['CFBundleIconFiles']=['NullexIcon60']
          d['CFBundleIcons']={
              'CFBundlePrimaryIcon': {
                  'CFBundleIconFiles':['NullexIcon60']
              }
          }
          d['CFBundleIcons~ipad']={
              'CFBundlePrimaryIcon': {
                  'CFBundleIconFiles':['NullexIcon60','NullexIcon76','NullexIcon83.5']
              }
          }
          with open(p,'wb') as f:
              plistlib.dump(d,f,fmt=plistlib.FMT_BINARY)
          PY

          # Byte-for-byte verification after the exact resize operation.
          cmp "$OUT/NullexIcon60@2x.png" "$APP/NullexIcon60@2x.png"
          cmp "$OUT/NullexIcon60@3x.png" "$APP/NullexIcon60@3x.png"
          cmp "$OUT/NullexIcon76@2x~ipad.png" "$APP/NullexIcon76@2x~ipad.png"
          cmp "$OUT/NullexIcon83.5@2x~ipad.png" "$APP/NullexIcon83.5@2x~ipad.png"
          shasum -a 256 "$APP"/NullexIcon*.png

      - name: Verify built app and extensions
        working-directory: wblock
        run: |
          set -euo pipefail
          APP="$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test -f "$APP/Info.plist"

          echo "Built app: $APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.nightvibes33.nullex"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")" = "Nullex"

          # Xcode derives CFBundleName from upstream target PRODUCT_NAME values.
          # Normalize only bundle metadata; keep executable/module names intact.
          for ext in "$APP"/PlugIns/*.appex; do
            plist="$ext/Info.plist"
            display="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")"
            /usr/libexec/PlistBuddy -c "Set :CFBundleName $display" "$plist"
          done

          CORE_FW="$APP/Frameworks/wBlockCoreService.framework"
          if [ -f "$CORE_FW/Info.plist" ]; then
            /usr/libexec/PlistBuddy -c 'Set :CFBundleName NullexCoreService' "$CORE_FW/Info.plist"
            if /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$CORE_FW/Info.plist" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName Nullex Core Service' "$CORE_FW/Info.plist"
            else
              /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string Nullex Core Service' "$CORE_FW/Info.plist"
            fi
          fi

          ext_count=0
          blocker_count=0
          webext_count=0
          for ext in "$APP"/PlugIns/*.appex; do
            test -d "$ext"
            ext_count=$((ext_count + 1))
            plist="$ext/Info.plist"
            test -f "$plist"
            display="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist" 2>/dev/null || true)"
            name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist" 2>/dev/null || true)"
            ident="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist" 2>/dev/null || true)"
            point="$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$plist" 2>/dev/null || true)"
            test -n "$display"
            test -n "$name"
            test -n "$ident"
            test -n "$point"

            case "$ident" in
              com.nightvibes33.nullex.blocker1) expected="Nullex 1"; expected_point="com.apple.Safari.content-blocker"; blocker_count=$((blocker_count + 1));;
              com.nightvibes33.nullex.blocker2) expected="Nullex 2"; expected_point="com.apple.Safari.content-blocker"; blocker_count=$((blocker_count + 1));;
              com.nightvibes33.nullex.blocker3) expected="Nullex 3"; expected_point="com.apple.Safari.content-blocker"; blocker_count=$((blocker_count + 1));;
              com.nightvibes33.nullex.blocker4) expected="Nullex 4"; expected_point="com.apple.Safari.content-blocker"; blocker_count=$((blocker_count + 1));;
              com.nightvibes33.nullex.blocker5) expected="Nullex 5"; expected_point="com.apple.Safari.content-blocker"; blocker_count=$((blocker_count + 1));;
              com.nightvibes33.nullex.advanced) expected="Nullex Advanced"; expected_point="com.apple.Safari.web-extension"; webext_count=$((webext_count + 1));;
              *) echo "Unexpected/exposed extension identifier: $ident"; exit 1;;
            esac

            test "$display" = "$expected"
            test "$name" = "$expected"
            test "$point" = "$expected_point"
            echo "$display -> $ident [$point]"
          done

          # Exactly upstream parity: five blockers + one Advanced web extension.
          test "$ext_count" -eq 6
          test "$blocker_count" -eq 5
          test "$webext_count" -eq 1

      - name: Preserve app-group entitlements for SideStore resigning
        working-directory: wblock
        run: |
          set -euo pipefail
          APP="$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"

          # SideStore discovers capabilities from the IPA it is about to re-sign.
          # The Xcode CI build itself is unsigned, so attach a minimal ad-hoc
          # signature containing ONLY the App Group capability Nullex actually
          # needs. SideStore will replace these signatures with the user's profile.
          ENT="$RUNNER_TEMP/Nullex-Sideload.entitlements"
          cat > "$ENT" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.application-groups</key>
            <array>
              <string>group.com.nightvibes33.nullex</string>
            </array>
          </dict>
          </plist>
          PLIST

          while IFS= read -r item; do
            /usr/bin/codesign --force --sign - --timestamp=none "$item"
          done < <(find "$APP" \( -name '*.framework' -o -name '*.dylib' \) -print | sort -r)

          for ext in "$APP"/PlugIns/*.appex; do
            test -d "$ext"
            /usr/bin/codesign --force --sign - --timestamp=none --entitlements "$ENT" "$ext"
          done

          /usr/bin/codesign --force --sign - --timestamp=none --entitlements "$ENT" "$APP"

          APP_ENT="$RUNNER_TEMP/app-entitlements.plist"
          /usr/bin/codesign -d --entitlements :- "$APP" > "$APP_ENT" 2>/dev/null
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$APP_ENT" | grep -qx 'group.com.nightvibes33.nullex'

          for ext in "$APP"/PlugIns/*.appex; do
            EXT_ENT="$RUNNER_TEMP/$(basename "$ext").entitlements.plist"
            /usr/bin/codesign -d --entitlements :- "$ext" > "$EXT_ENT" 2>/dev/null
            /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$EXT_ENT" | grep -qx 'group.com.nightvibes33.nullex'
          done

          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Verify no user-visible wBlock branding remains
        working-directory: wblock
        run: |
          set -euo pipefail
          APP="$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          fail=0

          while IFS= read -r -d '' file; do
            if grep -a -n 'wBlock' "$file"; then
              echo "User-visible wBlock branding remains in $file"
              fail=1
            fi
          done < <(find "$APP" -type f \( -name '*.strings' -o -name 'messages.json' -o -name 'manifest.json' \) -print0)

          python3 - "$APP" <<'PY'
          import plistlib, sys
          from pathlib import Path
          app=Path(sys.argv[1])
          bad=[]
          for p in app.rglob("Info.plist"):
              try:
                  with p.open("rb") as fh:
                      d=plistlib.load(fh)
              except Exception:
                  continue
              for key in ("CFBundleDisplayName", "CFBundleName", "NSHumanReadableDescription"):
                  value=d.get(key)
                  if isinstance(value,str) and "wBlock" in value:
                      bad.append(f"{p}:{key}={value}")
          if bad:
              print("\n".join(bad))
              raise SystemExit(1)
          PY

          # Targeted binary phrases that can surface through SwiftUI fallback
          # strings. Internal module/symbol names are intentionally ignored.
          BIN="$APP/wBlock"
          for phrase in 'Welcome to wBlock' 'Set up wBlock' 'wBlock Scripts' 'Restart wBlock' 'Part of wBlock' "wBlock's" 'wBlock’s'; do
            if strings "$BIN" | grep -F "$phrase"; then
              echo "Visible branding phrase remains in executable: $phrase"
              fail=1
            fi
          done

          test "$fail" -eq 0

      - name: Verify canonical + SideStore-style package identities
        working-directory: wblock
        run: |
          set -euo pipefail
          APP="$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test -f "$APP/Info.plist"

          # Canonical package identity from the real iPhoneOS Release build.
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.nightvibes33.nullex"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"

          # Exercise the same identifier rewrite SideStore performs and verify
          # every embedded extension stays inside the rewritten host family.
          REWRITTEN="$RUNNER_TEMP/Nullex-Rewritten.app"
          rm -rf "$REWRITTEN"
          ditto "$APP" "$REWRITTEN"

          python3 - "$REWRITTEN" <<'PY'
          import glob, os, plistlib, sys
          app=sys.argv[1]
          token='39A8Q3T3TR'
          host=f'com.nightvibes33.nullex.{token}'

          p=os.path.join(app,'Info.plist')
          with open(p,'rb') as f:
              d=plistlib.load(f)
          d['CFBundleIdentifier']=host
          with open(p,'wb') as f:
              plistlib.dump(d,f,fmt=plistlib.FMT_BINARY)

          for p in glob.glob(os.path.join(app,'PlugIns','*.appex','Info.plist')):
              with open(p,'rb') as f:
                  e=plistlib.load(f)
              suffix=e.get('CFBundleIdentifier','').rsplit('.',1)[-1]
              e['CFBundleIdentifier']=f'{host}.{suffix}'
              with open(p,'wb') as f:
                  plistlib.dump(e,f,fmt=plistlib.FMT_BINARY)
          PY

          REWRITTEN_ID="com.nightvibes33.nullex.39A8Q3T3TR"
          REWRITTEN_GROUP="group.com.nightvibes33.nullex.39A8Q3T3TR"
          ENT="$RUNNER_TEMP/nullex-rewritten.entitlements"
          cat > "$ENT" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>com.apple.security.application-groups</key>
          <array><string>$REWRITTEN_GROUP</string></array>
          </dict></plist>
          PLIST

          for ext in "$REWRITTEN"/PlugIns/*.appex; do
            plist="$ext/Info.plist"
            ident="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
            case "$ident" in
              "$REWRITTEN_ID".*) ;;
              *) echo "Unexpected rewritten extension identifier: $ident"; exit 1 ;;
            esac
            /usr/bin/codesign --force --sign - --timestamp=none --entitlements "$ENT" "$ext"
          done

          /usr/bin/codesign --force --sign - --timestamp=none --entitlements "$ENT" "$REWRITTEN"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$REWRITTEN/Info.plist")" = "$REWRITTEN_ID"
          REWRITTEN_ENT="$RUNNER_TEMP/nullex-rewritten-entitlements.plist"
          /usr/bin/codesign -d --entitlements :- "$REWRITTEN" >"$REWRITTEN_ENT" 2>/dev/null
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$REWRITTEN_ENT" | grep -qx "$REWRITTEN_GROUP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$REWRITTEN"

          # Ensure the runtime resolver needed after SideStore rewriting is
          # actually present in the overlay used for this build.
          grep -q 'containingAppBundleIdentifier' wBlockCoreService/GroupIdentifier.swift
          grep -q 'provisionedApplicationGroups' wBlockCoreService/GroupIdentifier.swift
          grep -q 'group.\\(family)' wBlockCoreService/GroupIdentifier.swift

      - name: Package SideStore-resignable Nullex IPA
        working-directory: wblock
        run: |
          set -euo pipefail
          APP="$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          rm -rf Payload Nullex-iOS27-resignable.ipa
          mkdir Payload
          cp -R "$APP" Payload/Nullex.app
          /usr/bin/zip -qry Nullex-iOS27-resignable.ipa Payload
          unzip -t Nullex-iOS27-resignable.ipa
          shasum -a 256 Nullex-iOS27-resignable.ipa

      - name: Package corresponding source
        run: |
          set -euo pipefail
          tar -czf Nullex-wBlock-GPL-source.tar.gz \
            --exclude='.git' \
            --exclude='DerivedData' \
            --exclude='DerivedDataSim' \
            -C wblock .

      - name: Upload Nullex IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nullex-iOS27-resignable
          path: wblock/Nullex-iOS27-resignable.ipa
          compression-level: 0
          if-no-files-found: error

      - name: Upload GPL corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: Nullex-GPL-source
          path: Nullex-wBlock-GPL-source.tar.gz
          compression-level: 0
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Nullex-build-log
          path: wblock/xcodebuild.log
          if-no-files-found: ignore
