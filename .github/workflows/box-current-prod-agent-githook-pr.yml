name: Box current prod guest-agent git-hook auth
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  current-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve current public ascii-prod guest-agent and validate git-hook route
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cpa && mkdir -p /tmp/cpa/work
          O=box-current-prod-agent-githook.txt
          git ls-remote --tags --refs https://github.com/ariana-dot-dev/agent-server.git \
            | awk '{print $2}' | sed 's#refs/tags/##' | grep -E '^agent-server-v[0-9].*-ascii-prod[0-9]+$' | sort -V > /tmp/cpa/tags
          latest=$(tail -1 /tmp/cpa/tags)
          {
            echo '=== last 30 ascii-prod agent tags ==='; tail -30 /tmp/cpa/tags
            echo "LATEST=$latest"
          } >$O
          [ -n "$latest" ]
          url="https://github.com/ariana-dot-dev/agent-server/releases/download/$latest/ascii-agents-server-linux-x64"
          code=$(curl -L -sS -o /tmp/cpa/agent -w '%{http_code}' "$url" || true)
          echo "DOWNLOAD_HTTP=$code" >>$O
          if [ "$code" != 200 ]; then echo 'LATEST_PUBLIC_ASSET_UNAVAILABLE' >>$O; cat $O; exit 0; fi
          chmod +x /tmp/cpa/agent
          echo "SHA256=$(sha256sum /tmp/cpa/agent|awk '{print $1}')" >>$O
          cat >/tmp/cpa/mock.py <<'PY'
          from http.server import BaseHTTPRequestHandler,HTTPServer
          from pathlib import Path
          class H(BaseHTTPRequestHandler):
            def do_POST(self):
              n=int(self.headers.get('content-length','0') or 0); b=self.rfile.read(n)
              with Path('/tmp/cpa/backend.log').open('a') as f:
                f.write('PATH='+self.path+'\nAUTH='+self.headers.get('authorization','')+'\nBODY='+b.decode('utf8','replace')+'\n---\n')
              out=b'{"exitCode":51,"marker":"CURRENT_PROD_BACKEND"}'; self.send_response(200); self.send_header('content-type','application/json'); self.send_header('content-length',str(len(out))); self.end_headers(); self.wfile.write(out)
            def log_message(self,*a): pass
          HTTPServer(('127.0.0.1',19095),H).serve_forever()
          PY
          python3 /tmp/cpa/mock.py & mpid=$!
          export MACHINE_ID=box-current-prod-test SHARED_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef WORK_DIR=/tmp/cpa/work HOME=/tmp/cpa/work ASCII_PORT=18925 IS_SANDBOX=1
          export ASCII_API_URL=http://127.0.0.1:19095 ASCII_TOKEN='CURRENT_PROD_TOKEN_MARKER' BACKEND_URL=http://127.0.0.1:19095 BOX_CLI_API_URL=http://127.0.0.1:19095
          /tmp/cpa/agent >/tmp/cpa/agent.log 2>&1 & apid=$!; trap 'kill $apid $mpid 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do curl -s --max-time 1 http://127.0.0.1:18925/health >/dev/null 2>&1 && break; sleep .2; done
          req(){ n=$1; p=$2; d=$3; : >/tmp/cpa/body; c=$(curl -sS --max-time 4 -o /tmp/cpa/body -w '%{http_code}' -H 'content-type: application/json' --data-binary "$d" "http://127.0.0.1:18925$p" 2>/dev/null||printf 000); echo "$n status=$c body=$(tr '\n\r' '  ' </tmp/cpa/body|head -c 500)" >>$O; }
          req control_start /start '{}'
          req githook /git-hook-event '{"hookType":"pre_commit","repoPath":"CURRENT_PROD_ATTACKER_PATH","branch":"CURRENT_PROD_ATTACKER_BRANCH","stagedFiles":["CURRENT_PROD_CANARY"]}'
          echo '=== backend ===' >>$O; cat /tmp/cpa/backend.log >>$O 2>/dev/null || true
          echo '=== startup/relevant ===' >>$O; grep -Eai 'Listening|git-hook|encrypted|error' /tmp/cpa/agent.log | tail -n 500 >>$O || true
          if grep -q 'AUTH=Bearer CURRENT_PROD_TOKEN_MARKER' /tmp/cpa/backend.log 2>/dev/null; then echo 'CURRENT_PROD_GITHOOK_CREDENTIALED_RELAY=CONFIRMED' >>$O; else echo 'CURRENT_PROD_GITHOOK_CREDENTIALED_RELAY=NOT_CONFIRMED' >>$O; fi
          cat $O
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: box-current-prod-agent-githook
          path: box-current-prod-agent-githook.txt
          if-no-files-found: error