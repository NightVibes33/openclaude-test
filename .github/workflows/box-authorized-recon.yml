name: Box Authorized Recon

on:
  push:
    branches: [main]
    paths-ignore:
      - 'box-research-results/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Probe legacy API authentication coverage
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p box-research-results
          OUT=box-research-results/deep-recon-4.txt
          exec > >(tee "$OUT") 2>&1
          date -u

          paths=(
            '/api/box/me'
            '/api/box/boxes'
            '/api/box/snapshots'
            '/api/box/named-snapshots'
            '/api/box/environments'
            '/api/box/limits'
            '/api/box/teams'
            '/api/box/orgs'
            '/api/box/api-keys'
            '/api/box/webhooks'
            '/api/box/data-retention'
            '/api/box/providers'
            '/api/box/deletions'
          )

          for h in ascii.dev staging.ascii.dev amsterdam.ascii.dev; do
            echo "========== $h =========="
            for p in "${paths[@]}"; do
              for variant in normal fakebearer orgpersonal orgcanary; do
                headers=()
                case "$variant" in
                  fakebearer) headers=(-H 'Authorization: Bearer box_invalid_canary_000000000000') ;;
                  orgpersonal) headers=(-H 'X-Box-Org: personal') ;;
                  orgcanary) headers=(-H 'X-Box-Org: org_canary_nonexistent') ;;
                esac
                printf '%-12s %-36s ' "$variant" "$p"
                curl -sS --max-time 10 "${headers[@]}" -o /tmp/b -D /tmp/h \
                  -w 'HTTP=%{http_code} BYTES=%{size_download} TYPE=%{content_type}\n' "https://$h$p" || true
                body=$(head -c 500 /tmp/b 2>/dev/null | tr '\n' ' ' | sed -E 's/[[:space:]]+/ /g; s/(token|secret|key)(["=: ]+)[A-Za-z0-9._-]{8,}/\1\2[REDACTED]/Ig')
                echo "BODY=$body"
              done
            done

            echo '=== harmless method-dispatch fingerprints ==='
            for p in '/api/box/boxes' '/api/box/api-keys' '/api/box/webhooks'; do
              for m in HEAD OPTIONS; do
                printf '%-8s %-36s ' "$m" "$p"
                curl -sS -X "$m" --max-time 10 -o /tmp/b -D /tmp/h \
                  -w 'HTTP=%{http_code} BYTES=%{size_download} TYPE=%{content_type}\n' "https://$h$p" || true
                grep -iE '^(allow:|access-control-allow-|www-authenticate:)' /tmp/h | tr '\n' ' '; echo
              done
            done
          done

          echo '=== exact legacy paths extracted from production/staging binaries ==='
          base='https://ascii.dev/api/box/cli/download'
          for c in ascii-prod staging; do
            curl -fsSL --max-time 45 "$base?platform=linux-x64&channel=$c" -o "/tmp/box-$c" || true
            strings -a "/tmp/box-$c" | grep -Eo '/api/box/[A-Za-z0-9_?&=./{}:-]+' | sort -u | head -n 1000 | sed "s/^/$c /" || true
          done

      - name: Persist text result
        shell: bash
        run: |
          git config user.name 'box-recon-bot'
          git config user.email 'box-recon-bot@users.noreply.github.com'
          git add -f box-research-results/deep-recon-4.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Record Box legacy API auth recon [skip ci]'
          git push origin HEAD:main
