name: Box release patch diff
on:
  push:
    paths:
      - '.github/workflows/box-agent-release-strings.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Diff recent public Box release artifacts
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/box-release-diff
          rm -rf "$root" && mkdir -p "$root/releases" "$root/extract" "$root/strings"
          curl -fsSL -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/ariana-dot-dev/agent-server/releases?per_page=100' \
            -o "$root/releases.json"

          report=box-release-patch-diff.txt
          : > "$report"
          {
            echo '=== recent release chronology ==='
            jq -r 'sort_by(.published_at)[] | select(.published_at >= "2026-08-20T00:00:00Z") | [.published_at,.tag_name,([.assets[].name]|join(","))] | @tsv' "$root/releases.json"
            echo
            echo '=== latest node-manager releases ==='
            jq -r '[.[] | select(.tag_name|startswith("node-manager-v"))] | sort_by(.published_at) | reverse | .[:12][] | [.published_at,.tag_name] | @tsv' "$root/releases.json"
            echo
            echo '=== latest agent-server releases ==='
            jq -r '[.[] | select(.tag_name|startswith("agent-server-v"))] | sort_by(.published_at) | reverse | .[:12][] | [.published_at,.tag_name] | @tsv' "$root/releases.json"
          } >> "$report"

          mapfile -t nmtags < <(jq -r '[.[] | select(.tag_name|startswith("node-manager-v"))] | sort_by(.published_at) | reverse | .[:8] | reverse[] | .tag_name' "$root/releases.json")
          for tag in "${nmtags[@]}"; do
            url=$(jq -r --arg t "$tag" '.[] | select(.tag_name==$t) | .assets[]? | select(.name=="ascii-node-manager-linux-x64.tar.gz") | .browser_download_url' "$root/releases.json" | head -1)
            [ -n "$url" ] || continue
            mkdir -p "$root/extract/$tag"
            curl -fL --retry 2 "$url" -o "$root/releases/$tag.tgz"
            tar -xzf "$root/releases/$tag.tgz" -C "$root/extract/$tag"
            sha256sum "$root/releases/$tag.tgz" >> "$root/node-manager-sha256.txt"
            if [ -x "$root/extract/$tag/bin/ascii-node-manager" ]; then
              strings -a -n 5 "$root/extract/$tag/bin/ascii-node-manager" | sort -u > "$root/strings/$tag.txt"
            fi
          done

          {
            echo
            echo '=== node-manager artifact sha256 ==='
            cat "$root/node-manager-sha256.txt" 2>/dev/null || true
          } >> "$report"

          for ((i=1; i<${#nmtags[@]}; i++)); do
            prev=${nmtags[$((i-1))]}; curr=${nmtags[$i]}
            [ -d "$root/extract/$prev" ] && [ -d "$root/extract/$curr" ] || continue
            {
              echo
              echo "=== SCRIPT DIFF $prev -> $curr ==="
              diff -ruN --exclude='ascii-node-manager' --exclude='*.pyc' --exclude='manifest.json' --exclude='SHA256SUMS' \
                "$root/extract/$prev" "$root/extract/$curr" || true
              if [ -f "$root/strings/$prev.txt" ] && [ -f "$root/strings/$curr.txt" ]; then
                echo
                echo "=== NEW HIGH-SIGNAL BINARY STRINGS $prev -> $curr ==="
                comm -13 "$root/strings/$prev.txt" "$root/strings/$curr.txt" \
                  | grep -Eai 'auth|hmac|owner|tenant|isolation|bridge|firewall|network|ip|route|path|travers|image|snapshot|credential|secret|token|key|scope|provision|delete|vm|domain|symlink|realpath|canonical|shell|exec|command|header|forwarded|request|signature|nonce|timestamp' \
                  | head -n 5000 || true
              fi
            } >> "$report"
          done

          # Preserve the newest publicly shipped source-like node-manager files so
          # sibling security controls can be reviewed directly.
          latest=${nmtags[$((${#nmtags[@]}-1))]}
          rm -rf box-node-manager-latest
          mkdir -p box-node-manager-latest
          cp -a "$root/extract/$latest/bare-metal-node" box-node-manager-latest/
          rm -rf box-node-manager-latest/bare-metal-node/__pycache__
          find box-node-manager-latest -type f \( -name '*.pyc' -o -name 'ascii-node-manager' \) -delete
          printf '%s\n' "$latest" > box-node-manager-latest/RELEASE_TAG

          mapfile -t gatags < <(jq -r '[.[] | select(.tag_name|startswith("agent-server-v"))] | sort_by(.published_at) | reverse | .[:6] | reverse[] | .tag_name' "$root/releases.json")
          for tag in "${gatags[@]}"; do
            url=$(jq -r --arg t "$tag" '.[] | select(.tag_name==$t) | .assets[]? | select(.name|test("(ascii|ariana)-agents-server-linux-x64$")) | .browser_download_url' "$root/releases.json" | head -1)
            [ -n "$url" ] || continue
            curl -fL --retry 2 "$url" -o "$root/releases/$tag-agent"
            strings -a -n 5 "$root/releases/$tag-agent" | sort -u > "$root/strings/$tag-agent.txt"
            sha256sum "$root/releases/$tag-agent" >> "$root/agent-sha256.txt"
          done
          {
            echo
            echo '=== guest-agent artifact sha256 ==='
            cat "$root/agent-sha256.txt" 2>/dev/null || true
          } >> "$report"
          for ((i=1; i<${#gatags[@]}; i++)); do
            prev=${gatags[$((i-1))]}; curr=${gatags[$i]}
            [ -f "$root/strings/$prev-agent.txt" ] && [ -f "$root/strings/$curr-agent.txt" ] || continue
            {
              echo
              echo "=== NEW HIGH-SIGNAL GUEST STRINGS $prev -> $curr ==="
              comm -13 "$root/strings/$prev-agent.txt" "$root/strings/$curr-agent.txt" \
                | grep -Eai 'auth|owner|tenant|network|host|desktop|vnc|file|path|snapshot|credential|secret|token|key|scope|box|machine|command|exec|shell|upload|download|websocket|origin|header|forwarded|request' \
                | head -n 5000 || true
            } >> "$report"
          done
          echo "Generated $(wc -l < "$report") lines"
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add box-release-patch-diff.txt box-node-manager-latest
          git diff --cached --quiet && exit 0
          git commit -m 'research: capture recent Box release patch diff and scripts'
          git push