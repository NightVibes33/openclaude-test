name: Box hosted-port token scope semantics
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect current production CLI help and strings
        shell: bash
        run: |
          set -euo pipefail
          O=box-host-scope-semantics.txt
          curl -fL 'https://ascii.dev/api/box/cli/download?platform=linux-x64&channel=ascii-prod' -o /tmp/box
          chmod +x /tmp/box
          {
            echo '=== version ==='; /tmp/box --version || true
            echo '=== top help ==='; /tmp/box --help || true
            for args in 'host --help' 'host' 'host list --help' 'host hide --help' 'info --help'; do
              echo; echo "=== box $args ==="; /tmp/box $args 2>&1 || true
            done
            echo; echo '=== focused raw strings ==='
            strings -a -n 5 /tmp/box | grep -Eai -C 12 'hosted ports are private|private by default|access token|protected access|protectedAccess|publicAccess|isProtected|host <port>|Expose.*port|--private|--public|share|service-preview|preview token|protected URL|private URL|host failed' | head -n 16000 || true
          } > "$O"
          cat "$O"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: box-host-scope-semantics
          path: box-host-scope-semantics.txt
          if-no-files-found: error